name: Fabriquer l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Générer et adapter le projet Android
        shell: bash
        run: |
          set -o pipefail
          {
            flutter create --org tn.immastudio --project-name app_creation_entreprise --platforms android /tmp/modele
            rm -rf android
            cp -r /tmp/modele/android ./android
            python3 tool/patch_android.py
            flutter pub get
          } 2>&1 | tee setup.log

      - name: Analyse du code
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Construire l'APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Joindre l'APK au résumé du workflow
        uses: actions/upload-artifact@v4
        with:
          name: Nebda-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publier la version de test téléchargeable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Nebda-test.apk
          gh release delete apk-test --yes --cleanup-tag || true
          gh release create apk-test Nebda-test.apk --prerelease \
            --target "$GITHUB_SHA" \
            --title "Version de test (dernière)" \
            --notes "APK fabriqué automatiquement à partir du commit ${GITHUB_SHA::7}. À installer sur Android pour tester."

      - name: Enregistrer les journaux dans la branche ci-logs
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logs
          cp setup.log analyze.log build.log /tmp/logs/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > /tmp/logs/status.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          rm -rf logs && cp -r /tmp/logs logs
          git add -f logs
          git commit -m "Journaux CI ${GITHUB_SHA::7}" > /dev/null
          git push -f origin ci-logs-tmp:ci-logs
